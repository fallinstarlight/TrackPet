<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | TrackPet</title><link rel="stylesheet" href="styles/style.css">
</head>
<body>
<header class="site-header"><div class="site-nav"><a class="brand" href="index.html">Track<span>Pet</span></a><nav aria-label="Navegación principal"><a href="index.html">Comunidad</a><a href="new-report.html">Reportar pérdida</a><a href="sightings.html">Mis avistamientos</a><a href="about.html">El proyecto</a><a id="accountLink" href="login.html">Iniciar sesión</a></nav></div></header>
  <div class="hero" aria-hidden="true"></div>
  <main class="login-container">
    <form id="registerForm" class="login-form">
      <h1>Crea tu cuenta</h1>
      <div class="field"><label for="firstName">Nombre</label><input id="firstName" name="firstName" autocomplete="given-name" maxlength="50" required></div>
      <div class="field"><label for="surname">Apellidos</label><input id="surname" name="surname" autocomplete="family-name" maxlength="50" required></div>
      <div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" maxlength="25" required></div>
      <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="email" maxlength="50" required></div>
      <div class="field"><label for="phone">Teléfono (opcional)</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="15"></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp"></div>
      <p id="passwordHelp">Usa al menos 8 caracteres, mayúscula, minúscula, número y un símbolo de @$!%*?&amp;_.</p>
      <button type="submit" class="btn btn--primary">Registrarme</button>
      <a href="login.html">Volver al inicio de sesión</a>
      <p id="formMessage" class="form-message" role="status"></p>
    </form>
  </main>
  <script type="module" src="scripts/register.js"></script>
</body>
</html>
